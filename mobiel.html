<style>:root{--bg:#f4f5f7;--fg:#1a1a1f;--head:#fff;--card:#fff;--line:#e7e7ee;--muted:#777;--accent:#d6168f;--thbg:#faf7fb;--sel:#fff;--selbd:#d9d9e2}body.dark{--bg:#0c0c0e;--fg:#f4f4f6;--head:#161619;--card:#161619;--line:#2c2c33;--muted:#9b9ba6;--accent:#ff2bd6;--thbg:#1e1e23;--sel:#1e1e23;--selbd:#2c2c33}body.dark header img{filter:invert(1)}*{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.45;font-size:15px}header{position:sticky;top:0;z-index:10;background:var(--head);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}header img{height:30px}header .ti{font-weight:800;font-size:15px}.themebtn{margin-left:8px;border:1px solid var(--selbd);background:var(--sel);color:var(--fg);border-radius:20px;padding:5px 10px;font-size:15px;cursor:pointer;line-height:1}header .ed{color:var(--muted);font-size:12px;margin-left:auto}nav{position:sticky;top:51px;z-index:10;display:flex;background:var(--head);border-bottom:1px solid var(--line)}.tabbtn{flex:1;border:none;background:none;padding:13px;font-size:14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}.tabbtn.on{color:var(--accent);border-bottom-color:var(--accent)}main{max-width:760px;margin:0 auto;padding:14px}h3.d{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}h3.d:first-child{margin-top:0}.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}@keyframes fla{0%,40%{box-shadow:0 0 0 4px var(--accent);background:rgba(215,22,143,.1)}100%{box-shadow:none;background:none}}.c.flash{animation:fla 1.7s ease}.c .ch{display:flex;align-items:center;gap:8px;margin-bottom:6px}.c .b{font-weight:800;font-size:12px;padding:3px 9px;border-radius:6px;color:#12001c}.c .t{color:var(--muted);font-size:12.5px;font-weight:600}.c .h{font-weight:800;font-size:15.5px}.c .h .f{color:var(--muted);font-weight:600}.c .m{color:var(--muted);font-size:13px;margin:2px 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line)}.c .x{font-size:13.5px}.c .x ul,.c .x ol{margin:.3em 0;padding-left:1.3em}.c img{max-width:100%;border-radius:8px;margin-top:8px;border:1px solid var(--line)}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.filters select{flex:1;min-width:140px;padding:9px;border:1px solid var(--selbd);border-radius:9px;background:var(--sel);color:var(--fg);font-size:14px}.filters button{padding:9px 12px;border:1px solid var(--selbd);border-radius:9px;background:var(--sel);color:var(--fg);font-weight:700;font-size:13px;cursor:pointer}.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{border:1px solid var(--line);padding:7px 8px;text-align:center}th.ond,td.ond{position:sticky;left:0;background:var(--card);text-align:left;font-weight:700;min-width:130px;z-index:2}th{background:var(--thbg);position:sticky;top:0;font-size:11px;text-transform:uppercase}td.lev{text-align:left;color:var(--muted)}td.ver{text-align:left;color:var(--muted)}td.fill{font-weight:800;color:#12001c}th .vd{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:11px}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:12px;height:12px;border-radius:3px}.foot{text-align:center;color:var(--muted);font-size:11px;padding:18px 0 8px}.note{text-align:center;color:var(--muted);padding:30px 16px}</style>

function tijdKey(t){
  t=(t||'').toLowerCase().trim();
  let m=t.match(/(\d{1,2})\s*[:hu.]\s*(\d{2})/); if(m) return (+m[1])*60+(+m[2]);
  m=t.match(/^(\d{1,2})\s*[hu]$/); if(m) return (+m[1])*60;
  if(/ochtend|morgen/.test(t)) return 8*60;
  if(/voormiddag|vm\b/.test(t)) return 9*60;
  if(/middag/.test(t)&&!/na/.test(t)) return 12*60;
  if(/namiddag|nm\b/.test(t)) return 14*60;
  if(/avond/.test(t)) return 19*60;
  if(/nacht/.test(t)) return 23*60;
  if(/dag/.test(t)) return 11*60;
  return 9000;
}
function cmpActie(a,b){
  return (dagIndex(a.dag)-dagIndex(b.dag))
    || (tijdKey(a.tijdstip)-tijdKey(b.tijdstip))
    || ((a.seq!=null?a.seq:0)-(b.seq!=null?b.seq:0))
    || (a.id<b.id?-1:1);
}

window.jumpToPreview=function(actId){
  tabs.forEach(x=>x.classList.remove('on'));

function mLevTypes(){ return (S.leverancierTypes&&S.leverancierTypes.length)?S.leverancierTypes:[]; }
function mTypeById(id){ return mLevTypes().find(t=>t.id===id); }
function mMarkerKleur(actieId){ const a=(S.acties||[]).find(x=>x.id===actieId); if(!a) return '#9aa0a6'; const l=levById(a.leverancierId); if(!l||!l.type) return '#9aa0a6'; const t=mTypeById(l.type); return t?t.kleur:'#9aa0a6'; }
function mMarkerActies(){ const ids=[...new Set((S.plattegrond||[]).map(m=>m.actieId))]; return ids.map(id=>(S.acties||[]).find(a=>a.id===id)).filter(Boolean).sort(cmpActie); }

function mPgPaint(k){
  const MA=mMarkerActies();
  const lbl=document.getElementById('mpg-lbl'), curEl=document.getElementById('mpg-cur');

  if(curEl) curEl.textContent = k>=MA.length?'Volledige opbouw — sleep terug om af te spelen':mPgActieLabel(MA[k]);
  document.querySelectorAll('#mpg-ov .mpg-m').forEach(el=>{
    const p=+el.dataset.pos; el.classList.remove('hi','dim'); el.style.display='';
    if(k<MA.length){ if(p>k) el.style.display='none'; else if(p<k) el.classList.add('dim'); else el.classList.add('hi'); }

}
function mRgba(hex,a){ hex=(hex||'').replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join(''); const n=parseInt(hex,16); if(isNaN(n)) return 'rgba(154,160,166,'+a+')'; return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }

    return `<div class="mpg-m mpg-pin" data-pos="${p}" style="left:${m.x*100}%;top:${m.y*100}%;--c:${kl}" onclick="mPgTap('${a.id}')"><span class="mpg-dot"></span></div>`;

  .mpg-imgwrap{position:relative;display:inline-block;max-width:100%;line-height:0}
  .mpg-imgwrap img{display:block;width:100%;height:auto;-webkit-user-select:none;user-select:none}
  .mpg-ov{position:absolute;inset:0}
  .mpg-m{position:absolute;cursor:pointer}
  .mpg-pin{transform:translate(-50%,-50%)}
  .mpg-dot{display:block;width:16px;height:16px;border-radius:50%;background:var(--c);border:2px solid rgba(255,255,255,.92);box-shadow:0 1px 3px rgba(0,0,0,.55);box-sizing:border-box}
  .mpg-pin.hi .mpg-dot{box-shadow:0 0 0 3px #fff;transform:scale(1.25)}
  .mpg-rect{border:2px solid var(--c);border-radius:3px;transform-origin:center center;box-sizing:border-box}
  .mpg-rect.hi{box-shadow:0 0 0 2px #fff inset;z-index:5}
  .mpg-m.dim{filter:grayscale(1);opacity:.45}
  .mpg-legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 12px;font-size:12px}
  .mpg-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  </style>
  <div class="mpg-bar">
    <span class="mpg-step" id="mpg-lbl">Alles tonen</span>
    <input type="range" id="mpg-range" min="0" max="${MA.length}" value="${MA.length}">
    <div class="mpg-cur" id="mpg-cur"></div>
  </div>
  <div class="mpg-stage"><div class="mpg-imgwrap"><img src="plattegrond.jpg" alt="Plattegrond"><div class="mpg-ov" id="mpg-ov">${mk}</div></div></div>
  <div class="mpg-legend">${legend}</div>`;
  const range=document.getElementById('mpg-range');
  if(range) range.addEventListener('input',()=>mPgPaint(+range.value));
  mPgPaint(MA.length);
}

function renderAll(pub){
  S=pub.data||{};
  const ed=esc(pub.editie||S.editie||'');
  document.getElementById('hd-ed').textContent=ed?('Editie '+(pub.editie||S.editie)):'';
  document.title='Draaiboek Grensrock '+(pub.editie||S.editie||'');
  const days=activeDays();
  const acts=sortedActies();

  /* preview */
  let prev='', cur=null;
  acts.forEach(a=>{
    if(a.dag!==cur){ cur=a.dag; prev+=`<h3 class="d">${esc(dagKort(a.dag))}</h3>`; }
    const l=levById(a.leverancierId)||{}; const ev=effVerantw(a); const ci=dagIndex(a.dag); const col=ci>=0?DAGKLEUR[ci]:'#bbb';
    const loc=[a.locLeveren?('Leveren: '+a.locLeveren):'',a.locAfhalen?('Afhalen: '+a.locAfhalen):''].filter(Boolean).join(' · ');
    prev+=`<div class="c" id="act-${a.id}">
      <div class="ch"><span class="b" style="background:${col}">${esc(dagKort(a.dag))}</span><span class="t">${esc(a.datum||'')} · ${esc(a.tijdstip||'')}</span></div>
      <div class="h">${esc(l.onderwerp||'')} <span class="f">· ${esc(l.firma||'')}</span></div>
      <div class="m">${ev?'👤 '+esc(ev.naam):''}${loc?(ev?' · ':'')+esc(loc):''}</div>
      ${a.tekst?`<div class="x">${a.tekst}</div>`:''}
      ${a.img?`<img src="${a.img}" alt="" loading="lazy">`:''}
    </div>`;
  });
  secs.preview.innerHTML = prev || '<div class="note">Geen acties in deze publicatie.</div>';

  /* tabel */
  const levs=(S.leveranciers||[]).filter(l=>actiesVan(l.id).length).sort((x,y)=>(x.onderwerp||'').localeCompare(y.onderwerp||'','nl'));
  const headDays=days.map(d=>{const i=dagIndex(d);return `<th data-d="${esc(d)}" style="border-bottom:3px solid ${DAGKLEUR[i]}"><span class="vd">${esc(dagKort(d))}</span></th>`;}).join('');
  const body=levs.map(l=>{
    const vid=l.verantwoordelijkeId||'';
    const vids=[...rowVerantwIds(l)].join(' ');
    const dlist=days.filter(d=>(S.acties||[]).some(a=>a.leverancierId===l.id&&a.dag===d)).join('|');
    const cells=days.map(d=>{const i=dagIndex(d);const da=(S.acties||[]).filter(a=>a.leverancierId===l.id&&a.dag===d).sort(cmpActie);const n=da.length;return `<td data-d="${esc(d)}" ${n?`class="fill" style="background:${DAGKLEUR[i]};cursor:pointer" onclick="jumpToPreview('${da[0].id}')"`:''}>${n||''}</td>`;}).join('');
    return `<tr data-ond="${esc(l.id)}" data-firma="${esc((l.firma||'').toLowerCase())}" data-verantw="${esc(vids)}" data-days="${esc(dlist)}">
      <td class="ond">${esc(l.onderwerp||'')}</td><td class="lev">${esc(l.firma||'')}</td><td class="ver">${esc(mwNaam(vid)||'—')}</td>${cells}</tr>`;
  }).join('');

  const ondOpts=levs.map(l=>`<option value="${esc(l.id)}">${esc(l.onderwerp||'')}</option>`).join('');
  const firmas=[...new Set(levs.map(l=>l.firma).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'nl'));
  const firmaOpts=firmas.map(f=>`<option value="${esc(f.toLowerCase())}">${esc(f)}</option>`).join('');
  const verIds=[...new Set(levs.flatMap(l=>[...rowVerantwIds(l)]))].map(id=>mwById(id)).filter(Boolean).sort((a,b)=>a.naam.localeCompare(b.naam,'nl'));
  const verOpts=verIds.map(m=>`<option value="${esc(m.id)}">${esc(m.naam)}</option>`).join('');
  const dagOpts=days.map(d=>`<option value="${esc(d)}">${esc(dagKort(d))}</option>`).join('');
  const legend=days.map(d=>{const i=dagIndex(d);return `<span><i style="background:${DAGKLEUR[i]}"></i>${esc(dagKort(d))}</span>`;}).join('');

  secs.tabel.innerHTML=
    `<div class="filters">
      <select id="f-ond"><option value="">Alle onderwerpen</option>${ondOpts}</select>
      <select id="f-firma"><option value="">Alle leveranciers</option>${firmaOpts}</select>
      <select id="f-ver"><option value="">Alle verantwoordelijken</option>${verOpts}</select>
      <select id="f-dag"><option value="">Alle dagen</option>${dagOpts}</select>
      <button id="f-clear">Wissen</button></div>
    <div class="tw"><table id="tbl"><thead><tr><th class="ond">Onderwerp</th><th>Leverancier</th><th>Verantwoordelijke</th>${headDays}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="legend">${legend}</div>`;

  /* filters */
  const f=id=>document.getElementById(id);
  function apply(){
    const fo=f('f-ond').value, ff=f('f-firma').value, fv=f('f-ver').value, fd=f('f-dag').value;
    document.querySelectorAll('#tbl tbody tr').forEach(tr=>{
      let ok=true;
      if(fo&&tr.dataset.ond!==fo) ok=false;
      if(ff&&tr.dataset.firma!==ff) ok=false;
      if(fv&&(' '+tr.dataset.verantw+' ').indexOf(' '+fv+' ')<0) ok=false;
      if(fd&&('|'+tr.dataset.days+'|').indexOf('|'+fd+'|')<0) ok=false;
      tr.style.display=ok?'':'none';
    });
    document.querySelectorAll('#tbl [data-d]').forEach(c=>{ c.style.display=(!fd||c.dataset.d===fd)?'':'none'; });
  }
  ['f-ond','f-firma','f-ver','f-dag'].forEach(id=>f(id).addEventListener('change',apply));
  f('f-clear').addEventListener('click',()=>{ ['f-ond','f-firma','f-ver','f-dag'].forEach(id=>{f(id).value='';}); apply(); });

  /* PLATTEGROND TIJDELIJK VERBORGEN — uncomment om weer te tonen: buildPlattegrond(); */

  /* voettekst */
  let when='';
  try{ when=new Date(pub.gepubliceerd_op).toLocaleString('nl-BE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){}
  document.getElementById('foot').textContent='Grensrock · Draaiboek '+(pub.editie||'')+' · alleen-lezen'+(when?' · gepubliceerd '+when:'');
}

fetch(SUPABASE_URL+'/rest/v1/publicatie?id=eq.1&select=data,editie,gepubliceerd_op',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}})
  .then(r=>{ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
  .then(rows=>{
    if(!rows||!rows.length){ secs.preview.innerHTML='<div class="note">Er is nog niets gepubliceerd. Publiceer eerst vanuit de editor.</div>'; return; }
    renderAll(rows[0]);
  })
  .catch(e=>{ console.warn(e); secs.preview.innerHTML='<div class="note">Kan de gegevens niet laden.<br>Controleer je internetverbinding en herlaad de pagina.</div>'; });

if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }

</script>
</body>
</html>
